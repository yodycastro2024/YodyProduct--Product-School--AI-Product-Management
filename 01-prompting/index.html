// ---- tiny markdown renderer ---------------------------------------------
function inline(text, kp) {
  const nodes = [];
  const re = /(\*\*([^*]+)\*\*|\*([^*]+)\*|`([^`]+)`)/g;
  let last = 0;
  let m;
  let k = 0;
  while ((m = re.exec(text))) {
    if (m.index > last) nodes.push(text.slice(last, m.index));
    if (m[2] !== undefined) nodes.push(<strong key={kp + "b" + k}>{m[2]}</strong>);
    else if (m[3] !== undefined) nodes.push(<em key={kp + "i" + k}>{m[3]}</em>);
    else if (m[4] !== undefined) nodes.push(<code key={kp + "c" + k}>{m[4]}</code>);
    last = m.index + m[0].length;
    k++;
  }
  if (last < text.length) nodes.push(text.slice(last));
  return nodes;
}

function Markdown({ source }) {
  const blocks = [];
  const lines = source.replace(/\r/g, "").split("\n");
  let i = 0;
  let key = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) {
      i++;
      continue;
    }
    if (line.startsWith("### ")) {
      blocks.push(<h3 key={key++}>{inline(line.slice(4), "h3" + key)}</h3>);
      i++;
    } else if (line.startsWith("## ")) {
      blocks.push(<h2 key={key++}>{inline(line.slice(3), "h2" + key)}</h2>);
      i++;
    } else if (line.startsWith("# ")) {
      blocks.push(<h1 key={key++}>{inline(line.slice(2), "h1" + key)}</h1>);
      i++;
    } else if (line.trim() === "---") {
      blocks.push(<hr key={key++} />);
      i++;
    } else if (line.startsWith("> ")) {
      const items = [];
      while (i < lines.length && lines[i].startsWith("> ")) {
        items.push(lines[i].slice(2));
        i++;
      }
      blocks.push(
        <blockquote key={key++}>
          {items.map((t, ix) => (
            <span key={ix}>
              {inline(t, "q" + key + ix)}
              {ix < items.length - 1 ? <br /> : null}
            </span>
          ))}
        </blockquote>
      );
    } else if (/^\d+\.\s/.test(line)) {
      const items = [];
      while (i < lines.length && /^\d+\.\s/.test(lines[i])) {
        items.push(lines[i].replace(/^\d+\.\s/, ""));
        i++;
      }
      blocks.push(
        <ol key={key++}>
          {items.map((t, ix) => (
            <li key={ix}>{inline(t, "o" + key + ix)}</li>
          ))}
        </ol>
      );
    } else if (line.startsWith("- ")) {
      const items = [];
      while (i < lines.length && lines[i].startsWith("- ")) {
        items.push(lines[i].slice(2));
        i++;
      }
      blocks.push(
        <ul key={key++}>
          {items.map((t, ix) => (
            <li key={ix}>{inline(t, "u" + key + ix)}</li>
          ))}
        </ul>
      );
    } else {
      const para = [line];
      i++;
      while (
        i < lines.length &&
        lines[i].trim() &&
        !/^(#|>|-\s|\d+\.\s|---)/.test(lines[i])
      ) {
        para.push(lines[i]);
        i++;
      }
      blocks.push(<p key={key++}>{inline(para.join(" "), "p" + key)}</p>);
    }
  }
  return <div className="prose">{blocks}</div>;
}

function PriorityBars({ level }) {
  const active = level === "High" ? 3 : level === "Medium" ? 2 : 1;
  const hs = [4, 7, 10];
  return (
    <svg width="13" height="12" viewBox="0 0 13 12" fill="none" style={{ display: "block" }}>
      {hs.map((h, i) => (
        <rect
          key={i}
          x={0.5 + i * 4.2}
          y={11 - h}
          width="2.6"
          height={h}
          rx="0.8"
          fill={i < active ? "#C9CCD3" : "#3A3D44"}
        />
      ))}
    </svg>
  );
}

function PriorityTag({ level }) {
  return (
    <span className="chip">
      <PriorityBars level={level} />
      <span style={{ color: level === "High" ? C.text : C.text2 }}>{level}</span>
    </span>
  );
}

function SentimentTag({ level }) {
  const color =

}

function JunoDashboard() {
  const [transcript, setTranscript] = useState(SAMPLE_TRANSCRIPT);
  const [status, setStatus] = useState("idle"); // idle | loading | done
  const [copied, setCopied] = useState(false);

  const words = useMemo(
    () => (transcript.trim() ? transcript.trim().split(/\s+/).length : 0),
    [transcript]
  );
  const canProcess = words > 0 && status !== "loading";
  const loading = status === "loading";
  const done = status === "done";

  function process() {
    if (!canProcess) return;
    setStatus("loading");
    setTimeout(() => setStatus("done"), 1500);
  }

  function onKey(e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();
      process();
    }
  }

  function copyPrd() {
    try {
      navigator.clipboard.writeText(PRD);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (e) {
      /* clipboard unavailable in sandbox */
    }
  }

  return (
    <div
      className="juno"
      style={{
        fontFamily: FONT,
        background: C.bg,
        color: C.text,
        height: "100vh",
        minWidth: 1120,
        display: "flex",
        flexDirection: "column",
        overflow: "hidden",
        WebkitFontSmoothing: "antialiased",
        MozOsxFontSmoothing: "grayscale",

    >
      <style>{CSS}</style>

      <div
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          padding: "12px 20px",
          flexShrink: 0,
        }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div
            style={{
              width: 26,
              height: 26,
              borderRadius: 7,
              background: C.accent,
              display: "grid",
              placeItems: "center",
              color: "#fff",

                "inset 0 1px 0 rgba(255,255,255,0.18), 0 1px 3px rgba(0,0,0,0.4)",
            }}
          >
            <IconSpark s={15} />
          </div>
          <div style={{ lineHeight: 1.25 }}>
            <div
              style={{ fontSize: 13.5, fontWeight: 560, letterSpacing: "-0.014em" }}
            >
              Juno
            </div>
            <div style={{ fontSize: 11.5, color: C.text3, letterSpacing: "-0.01em" }}>

              icon={<IconLayers s={20} />}
              title="No insights yet"
              body="Process a transcript to pull out themes, each tagged with priority and sentiment and tied to its evidence."
            />
          )}
        </Column>

        {/* right gap */}
        <div />

        {/* RIGHT — draft PRD */}
        <Column
          icon={<IconDoc s={15} />}
          title="Draft PRD"
          meta={done ? "Opportunity brief" : ""}
          bodyPad={loading || done ? "18px 20px 26px" : 0}
          action={
            done ? (
              <button className="ghost" onClick={copyPrd}>
                {copied ? "Copied" : "Copy markdown"}
              </button>
            ) : null
          }
        >
          {loading ? (
            <PrdSkeleton />
          ) : done ? (
            <Markdown source={PRD} />
          ) : (
            <EmptyState
              icon={<IconDoc s={20} />}
              title="Your draft brief lands here"
              body="Juno turns the insights into an evidence-backed Opportunity Brief, ready to refine and share."
            />
          )}
        </Column>
      </main>
    </div>
  );
}
